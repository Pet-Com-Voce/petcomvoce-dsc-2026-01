            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            font-variation-settings: 'FILL' 1;

<body class="bg-background text-on-background font-body min-h-screen flex flex-col items-center justify-center overflow-hidden antialiased">
<!-- Main Container -->
<main class="w-full max-w-md mx-auto h-[884px] flex flex-col relative bg-surface-container-lowest">
<!-- Decorative Background Glow -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary/10 rounded-full blur-[100px]"></div>
</div>
<!-- Illustration Canvas -->
<div class="flex-1 flex items-center justify-center p-xxl z-10 relative">
<div class="relative w-full max-w-[300px] aspect-square">
<!-- Glassmorphism Card Representation -->
<div class="absolute inset-0 bg-surface-container-high/40 backdrop-blur-md rounded-xl border border-outline-variant/30 shadow-[0_8px_32px_rgba(0,0,0,0.4)] flex flex-col overflow-hidden transform translate-y-4">
<!-- Card Header -->
<div class="px-md py-sm border-b border-outline-variant/30 flex items-center gap-sm bg-surface-container/50">
<div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[18px]">pets</span>
</div>
<div class="flex-1">
<div class="h-3 w-16 bg-on-surface-variant/20 rounded-full mb-1"></div>
<div class="h-2 w-24 bg-on-surface-variant/10 rounded-full"></div>
</div>
</div>
<!-- Card Body -->
<div class="p-md flex-1 flex flex-col gap-sm">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">vaccines</span>
<div class="h-2 w-full bg-on-surface-variant/10 rounded-full"></div>
</div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">medical_services</span>
<div class="h-2 w-3/4 bg-on-surface-variant/10 rounded-full"></div>
</div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">prescriptions</span>
<div class="h-2 w-5/6 bg-on-surface-variant/10 rounded-full"></div>
</div>
</div>
</div>
<!-- Floating Element 1 -->
<div class="absolute -right-4 top-1/4 bg-surface-container-high border border-outline-variant rounded-lg p-sm shadow-lg flex items-center gap-xs transform rotate-6 animate-[bounce_4s_infinite]">
<span class="material-symbols-outlined text-primary text-[16px] filled">check_circle</span>
<span class="font-micro text-micro text-on-surface">Atualizado</span>
</div>
<!-- Floating Element 2 -->
<div class="absolute -left-4 bottom-1/4 bg-surface-container-high border border-outline-variant rounded-full p-sm shadow-lg transform -rotate-12 animate-[bounce_5s_infinite_reverse]">
<span class="material-symbols-outlined text-tertiary text-[20px]">cloud_sync</span>
</div>
</div>
</div>
<!-- Content Area -->
<div class="px-xxl pb-xxl z-10 flex flex-col items-center text-center">
<!-- Typography -->
<h1 class="font-h1 text-h1 text-on-surface mb-md">
                Prontuários e Pets
            </h1>
<p class="font-body text-body text-on-surface-variant mb-xxl max-w-[280px]">
                Acesse o histórico completo de cada pet em segundos, de qualquer lugar.
            </p>
<!-- Progress Indicators -->
<div class="flex items-center justify-center gap-sm mb-xxl">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary shadow-[0_0_8px_rgba(70,241,197,0.4)]"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
<!-- Action Area -->
<div class="w-full flex justify-between items-center">
<button class="font-body text-body text-on-surface-variant hover:text-on-surface transition-colors px-md py-sm">
                    Pular
                </button>
<button class="bg-primary text-on-primary-fixed font-h3 text-h3 px-xl py-md rounded-lg flex items-center gap-sm hover:bg-primary-container transition-colors shadow-[0_4px_12px_rgba(70,241,197,0.2)] active:scale-95">
                    Próximo
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
